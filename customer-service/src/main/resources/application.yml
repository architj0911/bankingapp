server:
  port: 8082
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://postgres-customer:5432/customerdb
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/oauth2/jwks
  cache: 
    type: redis 
    redis: 
      time-to-live: 300000 
  data: 
    redis: 
      host: redis 
      port: 6379
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
setu:
  base-url: ${SETU_BASE_URL:https://dg-sandbox.setu.co}
  client-id: ${SETU_CLIENT_ID:}
  client-secret: ${SETU_CLIENT_SECRET:}
  pan-product-id: ${SETU_PAN_PRODUCT_ID:}
  digilocker-product-key: ${SETU_DIGILOCKER_PRODUCT_KEY:}
