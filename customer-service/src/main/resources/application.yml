server:
  port: 8082
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-customer}:${DB_PORT:5432}/${DB_NAME:customerdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://auth-service:9000/oauth2/jwks}
  cache: 
    type: redis 
    redis: 
      time-to-live: 300000 
  data: 
    redis: 
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}
setu:
  base-url: ${SETU_BASE_URL:https://dg-sandbox.setu.co}
  callback-url: ${SETU_CALLBACK_URL:http://localhost:8080/api/kyc/callback}
  client-id: ${SETU_CLIENT_ID:}
  client-secret: ${SETU_CLIENT_SECRET:}
  pan-product-id: ${SETU_PAN_PRODUCT_ID:}
  digilocker-product-key: ${SETU_DIGILOCKER_PRODUCT_KEY:}
