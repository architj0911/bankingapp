server:
  port: 8083
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://postgres-account:5432/accountdb
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
  flyway:
    enabled: true
    locations: classpath:/db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/oauth2/jwks
  kafka:
    producer:
      bootstrap-servers: kafka:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[max.block.ms]": 1000
        "[spring.json.trusted.packages]": "*"
  cache:
    type: redis
    redis:
      time-to-live: 300000
  data:
    redis:
      host: redis
      port: 6379
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

customer-service:
  url: http://customer-service:8082
